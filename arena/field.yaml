# The competitive field.
#
# The goal of this repository is one unified engine that is the fastest thing
# in existence at caseless search -- single needle and multi needle, ASCII and
# UTF-8, in one construction rather than a family of special cases. This file
# lists what it has to beat.
#
# The field is therefore a work list, not a ceiling. A tier with no entrant is
# missing work here; it is never a reason to discount a result or to narrow the
# goal. Every engine below that is not yet wired in is an open task, and the
# right response to "that tier has no competitor" is to go put one in it.
#
# Two folding tiers exist. `simple` is 1:1 per code point and is what IndexFold
# and Matcher.Find implement today. `full` is 1:N -- sharp s folds to ss, the
# ligatures expand -- specified in README and not yet built. They are different
# fields, and an engine can be exact on one and adapted on the other.
# StringZilla is the clearest case: it implements full folding natively, so on
# the simple tier its time carries a timed simple-fold verification, while on
# the full tier it competes with no adapter at all and is the engine to beat.
#
# An entrant must also declare the instruction set it dispatched to at runtime,
# and refuse to race on a weaker path than the machine offers. A competitor
# quietly running a portable build is not a competitor, and a ratio measured
# against one says nothing. StringZilla's adapter is the model: it queries
# sz_capabilities() and errors rather than let a serial fallback flatter this
# repository. Vectorscan's AVX-512 support is a compile-time option that is off
# by default, so a distribution package is presumed handicapped until its
# dispatch is shown.
#
# semantic_status decides whether a baseline's time may enter x_vs_best:
#
#   exact          agrees with the arena oracle on every input, both tiers.
#                  Counts as a competitor.
#   exact-for-ascii  agrees on the ASCII tier only. Counts there, excluded
#                  from UTF-8 rows.
#   diagnostic     runs for reference but never enters x_vs_best, because its
#                  semantics differ (full folding vs simple folding, different
#                  match position, different tie rule).
#   unwired        a real competitor that is not yet callable from this arena.
#                  Any adaptation, preprocessing, or conversion needed for
#                  equivalence is timed as part of it, so a semantic mismatch
#                  is an adapter to write, not grounds for exclusion.
#
# Reporting rule: state which entrants a row actually ran against. A row whose
# only entrant is Go's regexp has been measured against a scalar NFA floor and
# must say so -- that is a reporting obligation, not a bar on the claim.

baselines:
  - name: regexp
    tier: [ascii, utf8]
    semantic_status: exact
    what: Go stdlib regexp with (?i), scalar NFA. The floor, not the field.

  - name: veloz
    tier: [ascii]
    semantic_status: exact-for-ascii
    what: mhr3/veloz ascii.IndexFold, hand-written NEON/AVX2. The real ASCII bar.

  - name: aho-corasick
    tier: [ascii]
    semantic_status: exact-for-ascii
    what: petar-dambovaliev/aho-corasick, DFA. Multi-pattern ASCII bar.

  - name: tolower
    tier: [ascii]
    semantic_status: diagnostic
    what: strings.ToLower + strings.Index. Not folding; wrong beyond ASCII.

  # The UTF-8 tier is unoccupied. That is the largest open task in this
  # repository: the engine claims a caseless UTF-8 result, and nothing here
  # yet contests it. Wire these in, adapters and all, then beat them.
  - name: rust-regex
    tier: [ascii, utf8]
    semantic_status: unwired
    what: Rust regex crate via rure FFI, (?i) with Unicode case folding.
          Teddy/memchr SIMD literal search. The strongest general entrant and
          the one an outside reader will name first.

  - name: vectorscan
    tier: [ascii, utf8]
    semantic_status: unwired
    what: Vectorscan/Hyperscan caseless literal set, SIMD multi-pattern. The
          real multi-needle bar, and the only entrant designed for the N=512
          shape. Reports all matches; needs a leftmost/tie adapter, timed as
          part of it. Build from source with BUILD_AVX512 and BUILD_AVX512VBMI
          on and prove the dispatch: those are off by default, so a package
          build races AVX2 at best and any ratio against it is a handicap.
          Being a literal-set engine, full folding forces it to case-expand,
          which is the cost the full tier exists to expose.

  - name: stringzilla
    tier: [utf8]
    semantic_status: unwired
    what: StringZilla v4.5 caseless UTF-8, AVX-512/NEON. Full folding, so on the
          simple tier it needs a simple-fold adapter, timed as part of it. On
          the full tier it needs no adapter and is the engine to beat. Must
          prove its Ice Lake dispatch via sz_capabilities() and refuse to run
          without it. Single-needle API only: a multi-needle row runs one native
          scan per pattern, which is the per-pattern loop this repository
          exists to remove, so beating it there proves little.

  - name: pcre2-jit
    tier: [utf8]
    semantic_status: unwired
    what: PCRE2 JIT, PCRE2_CASELESS|PCRE2_UTF. Needs an offset/tie adapter,
          timed as part of it.
