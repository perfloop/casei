name: ci
on: [push, pull_request]

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      # Isolation runs first. A candidate that reaches a competitor is
      # ineligible, so there is no point measuring it.
      - run: ./scripts/check-baseline-isolation.sh
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...

  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - run: sudo apt-get update && sudo apt-get install -y cargo cmake curl libboost-dev pkg-config python3-pip
      - name: prepare pinned native field
        working-directory: arena
        run: |
          native="$RUNNER_TEMP/casei-arena-native"
          ./pcre2/prepare.sh "$native"
          ./vectorscan/prepare.sh "$native"
          ./rure/prepare.sh "$native"
          ./rustac/prepare.sh "$native"
          ./stringzilla/prepare.sh "$native"
          echo "PKG_CONFIG_PATH=$native/root/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$native/root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$native/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - run: go vet ./...
        working-directory: arena
      # The agreement tests are the gate that keeps a baseline honest: every
      # entrant must match the arena's own oracle before its timings count.
      - run: go test ./...
        working-directory: arena
      # Keep the equal-ISA control live: candidate and optional AVX-512-only
      # entrants must not quietly retain AVX-512 while Vectorscan uses AVX2.
      - run: GODEBUG=cpu.avx512f=off go test ./...
        working-directory: arena
